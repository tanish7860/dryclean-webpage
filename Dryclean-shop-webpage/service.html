<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .section {
        background-color: #6991a363;


    }


    .services {
        max-width: 700px;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 30px;
        background-color: white;




    }

    .service {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: white;
        padding: 10px 20px;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        background-color: #6991a31f;

    }


    .label {
        background: linear-gradient(90deg, #f47b0a, #ff9a00);
        color: #000;
        font-weight: bold;
        font-size: 1.2rem;
        padding: 12px 20px;
        border-radius: 30px;
        flex: 1;
        margin-right: 15px;
        text-align: center;
    }


    .service img {
        width: 120px;
        height: auto;
        border-radius: 8px;
        object-fit: cover;
    }
</style>

<body>

    <div class="section">
        <div class="services">
            <div class="service">
                <div class="label">SOFA SPA</div>
                <img src="https://5.imimg.com/data5/SELLER/Default/2023/3/DV/ZW/QZ/17641679/sofa-dry-cleaner-services.webp"
                    alt="Sofa">
            </div>

            <div class="service">
                <div class="label">BLANKETS/QUILTS</div>
                <img src="https://5.imimg.com/data5/ANDROID/Default/2022/4/AS/LZ/JS/151330313/prod-20220417-1547175840110118923121817-jpg.jpg"
                    alt="Blankets">
            </div>

            <div class="service">
                <div class="label">Embroidery Cloths&amp; SAREES</div>
                <img src="https://glimageurl.golocall.com/golocal-post/image/191150_balusdrycleaners1549598636.jpeg"
                    alt="Sarees">
            </div>

            <div class="service">
                <div class="label">SHIRTS/T-SHIRTS</div>
                <img src="jacketes.webp" alt="Shirts">
            </div>

            <div class="service">
                <div class="label">SHOES</div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRMRy32fs1WNEUsykeGLzBT5XOH2yTGqYmQQg&s"
                    alt="Shoes">
            </div>
        </div>
    </div>
</body>

</html>
