<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DryClean Today Deals</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header {
      background-image: url(hero.bg.jpg);
      
      text-align: center;
      padding: 20px 0;
    }

    .deals-section {
      padding: 20px;
      text-align: center;
    }

    .deal-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .deal-box {
      background: white;
      border-radius: 8px;
      width: 250px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .deal-box img {
      width: 100%;
      border-radius: 8px;
    }

    .deal-box h3 {
      color: #333;
      margin: 10px 0 5px;
    }

    .deal-box p {
      color: #777;
      font-size: 14px;
    }

    .price {
      color: #2a9df4;
      font-weight: bold;
      margin-top: 5px;
    }

    .btn {
      display: inline-block;
      background-color: #822af4;
      color: white;
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: #1b7bcc;
    }
  </style>
</head>
<body>
  <header>
    <h1>DryClean Today Deals</h1>
    <p>Fresh offers just for you!</p>
  </header>

  <section class="deals-section">
    <h2>Today's Special Offers</h2>
    <div class="deal-container">
      <div class="deal-box">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjHBviPFe_PZ9GuzBAwSiid-odwzWYnzR7A&s" alt="Shirt Cleaning">
        <h3>Shirt Cleaning</h3>
        <p>Get your shirts spotless and fresh.</p>
        <p class="price">₹99 only</p>
        <a href="#" class="btn">Book Now</a>
      </div>

      <div class="deal-box">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQY_9pRjNa10VRfWAyQQizneHkszDtJhoDRXQ&s" alt="Suit Dry Clean">
        <h3>Suit Dry Clean</h3>
        <p>Perfect care for your premium suits.</p>
        <p class="price">₹249 only</p>
        <a href="#" class="btn">Book Now</a>
      </div>

      <div class="deal-box">
        <img src="https://5.imimg.com/data5/SELLER/Default/2022/8/EV/AY/WZ/156887289/curtain-dry-cleaning-services.jpg" alt="Curtain Wash">
        <h3>Curtain Wash</h3>
        <p>Keep your home fresh and dust-free.</p>
        <p class="price">₹199 only</p>
        <a href="#" class="btn">Book Now</a>
      </div>
    </div>
  </section>
</body>
</html>
